[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-inference-reliability-gate"
version = "0.1.0"
description = "A deterministic SLO, capacity, and cost gate for production AI inference workloads"
requires-python = ">=3.11"

[project.scripts]
ai-inference-gate = "ai_inference_reliability_gate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
